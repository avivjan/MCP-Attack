worker_processes auto;
worker_connections 65536; 

events {
    worker_connections 65536;
}

http {
    client_body_buffer_size 128k; 
    
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        # קריטי: הגדרות ל-SSE
        location /mcp/stream/ {
            proxy_pass http://172.20.0.10:8000; # פנייה ל-IP הסטטי של השרת
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # חיוני לחיבורים ארוכי טווח
            proxy_set_header Host $host;
            proxy_read_timeout 3600s; # מאפשר חיבורים ארוכים מאוד
        }

        # פרוקסי רגיל לשאר ה-API
        location / {
            proxy_pass http://172.20.0.10:8000; # פנייה ל-IP הסטטי של השרת
            proxy_set_header Host $host;
        }
    }
}