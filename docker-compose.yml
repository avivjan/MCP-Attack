version: '3.8'

networks:
  mcp_network:
    driver: bridge
    # הגדרת הסאבנט וטווח ה-IPs
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      STATE_KB: 16
      HEARTBEAT_SEC: 1.0
    ulimits: 
      nofile:
        soft: 65536
        hard: 65536
    networks:
      mcp_network:
        ipv4_address: 172.20.0.10  # IP סטטי לשרת

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - mcp-server
    ulimits: 
      nofile:
        soft: 65536
        hard: 65536
    networks:
      mcp_network:
        ipv4_address: 172.20.0.20  # IP סטטי ל-NGINX
    
  mcp-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      # **תיקון קריטי:** פנייה ישירה ל-IP הסטטי של השרת
      SERVER_URL: http://172.20.0.10:8000 
      STATE_KB: 16
      HEARTBEAT_SEC: 1.0
      DURATION_SEC: 15
    # תלוי בשרת בלבד
    depends_on:
      - mcp-server
    networks:
      - mcp_network